services:
  postgres:
    image: postgres:16-alpine
    container_name: cashcontrol-postgres
    environment:
      POSTGRES_USER: cashcontrol
      POSTGRES_PASSWORD: cashcontrol
      POSTGRES_DB: cashcontroldb
    ports:
      - "5432:5432"
    volumes:
      - cashcontrol-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashcontrol -d cashcontroldb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cashcontrol-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cashcontrol-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cashcontrol
      RABBITMQ_DEFAULT_PASS: cashcontrol
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cashcontrol-network

  # As três aplicações .NET (Transactions.Api, Consolidation.Worker, Consolidation.Api)
  # rodam direto pela IDE/dotnet run durante o desenvolvimento local, não pelo compose.
  #
  # Connection strings para rodar as apps localmente (fora do Docker), apontando
  # para as portas publicadas acima:
  #   Postgres: Host=localhost;Port=5432;Database=cashcontrol_transactions;Username=cashcontrol;Password=cashcontrol
  #             Host=localhost;Port=5432;Database=cashcontrol_consolidation;Username=cashcontrol;Password=cashcontrol
  #   RabbitMQ: Host=localhost;Port=5672;Username=cashcontrol;Password=cashcontrol

volumes:
  cashcontrol-postgres-data:

networks:
  cashcontrol-network:
    driver: bridge
